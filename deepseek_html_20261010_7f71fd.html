<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Блатные Номера: Симулятор Перекупа</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

body {
    background: #05070a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 6px;
    overflow: hidden;
}

.game-container {
    width: 100%;
    max-width: 430px;
    height: 880px;
    max-height: 98vh;
    background: linear-gradient(145deg, #0a0e14 0%, #05070a 100%);
    border-radius: 32px;
    box-shadow:
        0 0 60px rgba(0, 255, 255, 0.15),
        0 0 30px rgba(255, 0, 255, 0.1),
        inset 0 0 40px rgba(0, 0, 0, 0.9);
    border: 1px solid #1a2a3a;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    color: #e0f0ff;
}

/* ============ AUTH SCREEN ============ */
.auth-screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(145deg, #0a0e14 0%, #05070a 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 24px 22px;
    z-index: 500;
    border-radius: 32px;
    overflow-y: auto;
}

.auth-screen.hidden { display: none; }

.auth-logo {
    font-size: 26px;
    font-weight: 900;
    background: linear-gradient(90deg, #00ffc3, #00aaff, #ff00cc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 0 40px rgba(0, 255, 200, 0.5);
    margin-bottom: 6px;
    text-align: center;
    letter-spacing: 2px;
    animation: logoGlow 3s ease-in-out infinite;
}

@keyframes logoGlow {
    0%, 100% { filter: drop-shadow(0 0 15px rgba(0, 255, 200, 0.6)); }
    50% { filter: drop-shadow(0 0 35px rgba(0, 200, 255, 0.9)); }
}

.auth-sub {
    color: #4a7a8a;
    font-size: 12px;
    margin-bottom: 24px;
    letter-spacing: 4px;
    text-transform: uppercase;
    text-align: center;
}

.auth-toggle {
    display: flex;
    width: 100%;
    background: #0a141e;
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 14px;
    border: 1px solid #1a2a3a;
}

.auth-toggle-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: #4a7a8a;
    padding: 11px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.25s;
}

.auth-toggle-btn.active {
    background: #0f2a3a;
    color: #aae0ff;
    box-shadow: 0 0 15px rgba(0, 170, 255, 0.3);
    text-shadow: 0 0 8px #00ccff;
}

.auth-form { width: 100%; display: flex; flex-direction: column; }

.auth-input {
    width: 100%;
    background: #0a141e;
    border: 1px solid #1e3a4a;
    border-radius: 14px;
    padding: 14px 16px;
    color: #c0e0ff;
    font-size: 15px;
    margin-bottom: 10px;
    outline: none;
    transition: all 0.3s;
    box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.8);
}

.auth-input:focus {
    border-color: #00ccff;
    box-shadow: 0 0 20px rgba(0, 200, 255, 0.3), inset 0 0 12px rgba(0, 0, 0, 0.8);
}

.auth-input::placeholder { color: #3a5a6a; }

.auth-btn {
    width: 100%;
    background: linear-gradient(135deg, #0a3a5a, #0a1a2a);
    border: 1px solid #00aaff;
    border-radius: 14px;
    padding: 14px;
    color: #aae0ff;
    font-size: 15px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 0 20px rgba(0, 170, 255, 0.2);
    margin-bottom: 8px;
}

.auth-btn:active { transform: scale(0.97); box-shadow: 0 0 35px rgba(0, 200, 255, 0.5); }

.auth-btn.register {
    background: linear-gradient(135deg, #1a3a2a, #0a1f0f);
    border-color: #00ff88;
    color: #aaffcc;
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
}

.auth-error {
    color: #ff5566;
    font-size: 13px;
    margin-bottom: 10px;
    min-height: 18px;
    text-align: center;
    font-weight: 600;
    text-shadow: 0 0 10px rgba(255, 50, 80, 0.5);
}

.auth-reset {
    color: #6a4a4a;
    font-size: 11px;
    cursor: pointer;
    margin-top: 16px;
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid #3a2a2a;
    background: #0a0a0e;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
}

.auth-reset:active { background: #2a1a1a; color: #ff8888; box-shadow: 0 0 15px rgba(255, 80, 80, 0.4); }

/* ============ HEADER ============ */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: rgba(5, 10, 18, 0.95);
    border-bottom: 1px solid #1a2a3a;
    box-shadow: 0 4px 20px rgba(0, 255, 255, 0.08);
    z-index: 10;
    flex-shrink: 0;
}

.user-info { display: flex; flex-direction: column; gap: 2px; }

.username-display {
    font-size: 12px;
    font-weight: 700;
    color: #00ffc3;
    text-shadow: 0 0 10px rgba(0, 255, 195, 0.5);
}

.balance-box { display: flex; flex-direction: column; }

.balance-label {
    font-size: 9px;
    letter-spacing: 2px;
    color: #5f9ea0;
    text-transform: uppercase;
}

.balance-value {
    font-size: 19px;
    font-weight: 800;
    color: #aaffdd;
    text-shadow: 0 0 15px #00ffc3;
    line-height: 1.2;
    cursor: pointer;
}

.level-box { display: flex; flex-direction: column; align-items: center; gap: 3px; }

.level-row {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #0a1a24;
    padding: 3px 12px;
    border-radius: 20px;
    border: 1px solid #1e4a5a;
    box-shadow: inset 0 0 8px #000, 0 0 12px rgba(0, 150, 200, 0.2);
}

.level-row span:first-child { color: #5a8a9a; font-size: 10px; font-weight: 600; }
.level-row span:last-child { color: #aad4ff; font-weight: 800; font-size: 15px; }

.xp-bar-bg {
    width: 100%;
    height: 4px;
    background: #0a141e;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 2px;
}

.xp-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #00ffc3, #00aaff);
    border-radius: 4px;
    transition: width 0.4s ease;
    box-shadow: 0 0 8px #00ffc3;
}

.progress-text { font-size: 9px; color: #4a7a8a; text-align: center; letter-spacing: 0.5px; }

/* ============ MAIN ============ */
.main-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 8px 14px 0;
    overflow-y: auto;
    scrollbar-width: none;
}

.main-panel::-webkit-scrollbar { display: none; }

.buffs-row {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
    flex-wrap: wrap;
    flex-shrink: 0;
    min-height: 0;
}

.buff-badge {
    background: #0a1a24;
    border: 1px solid #4a8a9a;
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 11px;
    font-weight: 700;
    color: #aae0ff;
    display: flex;
    align-items: center;
    gap: 5px;
    box-shadow: 0 0 10px rgba(0, 200, 255, 0.2);
    animation: buffGlow 2s infinite;
}

@keyframes buffGlow {
    0%, 100% { box-shadow: 0 0 8px rgba(0, 200, 255, 0.2); }
    50% { box-shadow: 0 0 18px rgba(0, 200, 255, 0.5); }
}

/* TYPE SWITCHER */
.type-switcher {
    display: flex;
    gap: 3px;
    margin-bottom: 8px;
    background: #0a121c;
    border-radius: 14px;
    padding: 4px;
    border: 1px solid #1a2a3a;
    flex-shrink: 0;
}

.type-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: #4a7a8a;
    padding: 8px 1px;
    border-radius: 10px;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.3px;
    white-space: nowrap;
    position: relative;
}

.type-btn.active {
    background: #0f2a3a;
    color: #aae0ff;
    box-shadow: 0 0 15px rgba(0, 170, 255, 0.3);
    border: 1px solid #1e5a6a;
}

.type-btn.locked { opacity: 0.5; }
.type-btn .lock-icon { font-size: 8px; display: block; }

/* REGION SELECTOR */
.region-selector-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    flex-shrink: 0;
}

.region-selector-label {
    font-size: 11px;
    color: #5a8a9a;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.region-select {
    flex: 1;
    background: #0a141e;
    border: 1px solid #1e3a4a;
    border-radius: 12px;
    padding: 8px 12px;
    color: #c0e0ff;
    font-size: 13px;
    font-weight: 700;
    outline: none;
    cursor: pointer;
    transition: all 0.2s;
}

.region-select:disabled { opacity: 0.5; cursor: not-allowed; }

/* ============ PLATE (GOST STYLE) ============ */
.plate-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 4px 0 8px;
    position: relative;
    flex-shrink: 0;
}

.plate-wrapper {
    position: relative;
    width: 100%;
    max-width: 350px;
    border-radius: 12px;
    padding: 3px;
    background: linear-gradient(135deg, #555, #333);
    transition: all 0.3s;
}

.plate-wrapper.rarity-common { background: linear-gradient(135deg, #555, #333); }
.plate-wrapper.rarity-rare {
    background: linear-gradient(135deg, #00ccff, #0088cc);
    box-shadow: 0 0 25px rgba(0, 200, 255, 0.5);
    animation: neonPulseCyan 2s infinite;
}
.plate-wrapper.rarity-epic {
    background: linear-gradient(135deg, #aa00ff, #6600cc);
    box-shadow: 0 0 25px rgba(170, 0, 255, 0.5);
    animation: neonPulsePurple 2s infinite;
}
.plate-wrapper.rarity-legend {
    background: linear-gradient(135deg, #ffd700, #ffaa00);
    box-shadow: 0 0 35px rgba(255, 215, 0, 0.7);
    animation: neonPulseGold 1.2s infinite;
}
.plate-wrapper.rarity-gov {
    background: linear-gradient(135deg, #ff0000, #aa0000);
    box-shadow: 0 0 35px rgba(255, 0, 0, 0.7);
    animation: neonPulseRed 0.8s infinite;
}

@keyframes neonPulseCyan {
    0%, 100% { box-shadow: 0 0 20px rgba(0, 200, 255, 0.4); }
    50% { box-shadow: 0 0 40px rgba(0, 200, 255, 0.8); }
}
@keyframes neonPulsePurple {
    0%, 100% { box-shadow: 0 0 20px rgba(170, 0, 255, 0.4); }
    50% { box-shadow: 0 0 40px rgba(170, 0, 255, 0.8); }
}
@keyframes neonPulseGold {
    0%, 100% { box-shadow: 0 0 25px rgba(255, 215, 0, 0.5); transform: scale(1); }
    50% { box-shadow: 0 0 50px rgba(255, 215, 0, 0.9); transform: scale(1.01); }
}
@keyframes neonPulseRed {
    0%, 100% { box-shadow: 0 0 25px rgba(255, 0, 0, 0.5); }
    50% { box-shadow: 0 0 50px rgba(255, 0, 0, 0.9); }
}

/* REALISTIC PLATE */
.real-plate {
    width: 100%;
    height: 74px;
    background: #ffffff;
    border: 2px solid #111;
    border-radius: 6px;
    display: flex;
    align-items: center;
    padding: 0 4px 0 6px;
    position: relative;
    box-shadow: inset 0 0 0 1px #ffffff, inset 0 0 0 2px #111;
    font-family: 'Arial Black', 'Impact', 'Segoe UI Black', sans-serif;
    overflow: hidden;
}

.real-plate.type-moto { height: 74px; border-radius: 4px; }

.real-plate.type-spec {
    background: #111111;
    border-color: #eeeeee;
    box-shadow: inset 0 0 0 1px #111111, inset 0 0 0 2px #eeeeee;
}
.real-plate.type-spec .char { color: #eeeeee; }
.real-plate.type-spec .region-num { color: #eeeeee; }

.real-plate.type-police {
    background: #0a3a6a;
    border-color: #ffffff;
    box-shadow: inset 0 0 0 1px #0a3a6a, inset 0 0 0 2px #ffffff;
}
.real-plate.type-police .char { color: #ffffff; }
.real-plate.type-police .region-num { color: #ffffff; }

.real-plate.type-diplomat {
    background: #cc0000;
    border-color: #ffcc00;
    box-shadow: inset 0 0 0 1px #cc0000, inset 0 0 0 2px #ffcc00;
}
.real-plate.type-diplomat .char { color: #ffffff; }
.real-plate.type-diplomat .region-num { color: #ffffff; }

.plate-chars {
    display: flex;
    align-items: center;
    gap: 1px;
    flex: 1;
    justify-content: center;
    height: 100%;
}

/* SLOT MACHINE */
.slot {
    width: 30px;
    height: 54px;
    overflow: hidden;
    position: relative;
    display: inline-block;
    vertical-align: middle;
}

.slot .reel {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    will-change: transform;
}

.slot .reel .char {
    height: 54px;
    line-height: 54px;
    text-align: center;
    font-size: 38px;
    font-weight: 900;
    font-family: 'Arial Black', 'Impact', 'Segoe UI Black', sans-serif;
    flex-shrink: 0;
    width: 100%;
    color: #111;
    letter-spacing: 0;
}

/* Region box */
.region-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding-left: 6px;
    border-left: 2px solid #111;
    min-width: 68px;
    position: relative;
}

.real-plate.type-spec .region-box { border-left-color: #eeeeee; }
.real-plate.type-police .region-box { border-left-color: #ffffff; }
.real-plate.type-diplomat .region-box { border-left-color: #ffcc00; }

.region-num {
    font-size: 22px;
    font-weight: 900;
    color: #111;
    line-height: 1;
    font-family: 'Arial', sans-serif;
    letter-spacing: 1px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.region-flag-row {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 16px;
}

.flag {
    width: 22px;
    height: 14px;
    display: flex;
    flex-direction: column;
    border: 1px solid #999;
    border-radius: 1px;
    overflow: hidden;
}

.flag .f-white { flex: 1; background: #fff; }
.flag .f-blue { flex: 1; background: #0039a6; }
.flag .f-red { flex: 1; background: #d52b1e; }

.rus-text {
    font-size: 10px;
    font-weight: 700;
    color: #111;
    font-family: 'Arial', sans-serif;
    letter-spacing: 0.5px;
}

.real-plate.type-spec .rus-text { color: #eeeeee; }
.real-plate.type-police .rus-text { color: #ffffff; }
.real-plate.type-diplomat .rus-text { color: #ffffff; }

/* RARITY INFO */
.rarity-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 350px;
    margin-top: 6px;
    background: #0a141e;
    padding: 8px 16px;
    border-radius: 30px;
    border: 1px solid #1a3a4a;
    box-shadow: inset 0 0 10px #000, 0 0 15px rgba(0, 150, 200, 0.15);
}

.rarity-text { font-size: 15px; font-weight: 700; color: #b0e0ff; }
.rarity-text.legend { color: #ffd966; text-shadow: 0 0 15px #ffaa00; }
.rarity-text.gov { color: #ff4444; text-shadow: 0 0 15px #ff0000; }
.rarity-text.epic { color: #cc88ff; text-shadow: 0 0 12px #aa00ff; }
.rarity-text.rare { color: #66ddff; text-shadow: 0 0 12px #00aaff; }

.price-text {
    font-size: 18px;
    font-weight: 800;
    color: #aaffaa;
    text-shadow: 0 0 12px #00ff88;
}

/* CONTROLS */
.controls-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    margin: 10px 0 8px;
    flex-shrink: 0;
}

.ctrl-btn {
    background: linear-gradient(145deg, #0f1e2a, #0a121c);
    border: 1px solid #1e5a6a;
    border-radius: 22px;
    padding: 12px 0;
    font-size: 11px;
    font-weight: 700;
    color: #b0e0ff;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    box-shadow: 0 5px 0 #030a10, 0 7px 18px #000, 0 0 15px rgba(0, 150, 200, 0.2);
    transition: all 0.08s ease;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 4px;
    position: relative;
    overflow: hidden;
}

.ctrl-btn:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #030a10, 0 4px 12px #000, 0 0 25px rgba(0, 200, 255, 0.5);
}

.ctrl-btn:disabled {
    opacity: 0.35;
    transform: translateY(2px);
    box-shadow: 0 3px 0 #030a10;
    pointer-events: none;
    filter: grayscale(0.7);
}

.ctrl-btn.primary {
    background: linear-gradient(145deg, #0a3a4a, #061e2a);
    border-color: #4ac0d0;
    color: #ffffff;
    box-shadow: 0 5px 0 #030a10, 0 7px 18px #000, 0 0 20px rgba(0, 200, 200, 0.35);
}

.ctrl-btn.garage-btn {
    background: linear-gradient(145deg, #3a2a0a, #1f1505);
    border-color: #c0a05a;
    color: #ffe0a0;
    box-shadow: 0 5px 0 #030a10, 0 7px 18px #000, 0 0 20px rgba(200, 150, 0, 0.3);
}

.ctrl-btn.gov-btn {
    background: linear-gradient(145deg, #4a1a1a, #2a0a0a);
    border-color: #c05a5a;
    color: #ffd0d0;
    box-shadow: 0 5px 0 #030a10, 0 7px 18px #000, 0 0 20px rgba(200, 50, 50, 0.3);
    grid-column: span 2;
}

/* BOTTOM TABS */
.bottom-tabs {
    display: flex;
    background: #0a121c;
    border-top: 2px solid #1a2a3a;
    box-shadow: 0 -8px 20px rgba(0, 255, 255, 0.1);
    padding: 4px 4px 6px;
    gap: 3px;
    flex-shrink: 0;
}

.tab-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: #3a5a6a;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    padding: 8px 1px;
    border-radius: 18px;
    transition: all 0.2s;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    border: 1px solid transparent;
}

.tab-btn.active {
    background: #0f2a3a;
    color: #aae0ff;
    border-color: #1e6a7a;
    box-shadow: 0 0 20px rgba(0, 150, 200, 0.3), inset 0 0 10px #0a1a2a;
    text-shadow: 0 0 8px #00ccff;
}

.tab-icon { font-size: 18px; }

/* MODAL */
.modal-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.88);
    backdrop-filter: blur(8px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 300;
    border-radius: 32px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
}

.modal-overlay.active { opacity: 1; pointer-events: auto; }

.modal-content {
    background: #0a121c;
    width: 92%;
    max-width: 360px;
    max-height: 80%;
    border-radius: 24px;
    border: 1px solid #1e5a6a;
    box-shadow: 0 0 40px rgba(0, 200, 255, 0.3), inset 0 0 20px #000;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    color: #d0eaff;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    font-size: 18px;
    font-weight: 800;
    text-transform: uppercase;
    color: #aae0ff;
    text-shadow: 0 0 10px #00aaff;
    border-bottom: 1px solid #1a3a4a;
    padding-bottom: 10px;
}

.close-btn {
    background: #2a1010;
    border: 1px solid #aa4a4a;
    color: #ff8a8a;
    border-radius: 50%;
    width: 34px;
    height: 34px;
    font-size: 16px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
}

.close-btn:active { transform: scale(0.9); box-shadow: 0 0 15px #ff0000; }

.modal-list {
    overflow-y: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-right: 4px;
}

.modal-list::-webkit-scrollbar { width: 4px; }

    auto: 0,
    moto: 0,
    spec: 50000000,
    police: 15000000,
    diplomat: 10000000
};

/* ==================== HARDCODED ADMIN ==================== */

const ADMIN_PASSWORD = 'Lvovsky1209';

/* ==================== ONLINE MARKET STATE ==================== */

let npcListings = [];

/* ==================== INFINITE SPIN FIX ==================== */
let spinCount = 0;

/* ==================== GOST LETTERS ==================== */

/* ==================== STORAGE ==================== */
function getUsersDB() {
    try {
        const raw = localStorage.getItem('blat_users');
        if (!raw) return {};
        return JSON.parse(raw);
    } catch (e) { return {}; }
}

function saveUsersDB(db) {
    try { localStorage.setItem('blat_users', JSON.stringify(db)); }
    catch (e) { console.warn('Save DB error', e); }
}

function ensureDefaultAdmin() {
    const db = getUsersDB();
    if (!db[ADMIN_USERNAME]) {
        db[ADMIN_USERNAME] = {
            password: ADMIN_PASSWORD,
            balance: 500000000, level: 50, xp: 0, xpNext: 100000,
            garage: [],
            plate: null,
            activeBuffs: { luckSpins: 0, sellTimer: 0, sellActive: false },
            unlockedTypes: { auto: true, moto: true, spec: true, police: true, diplomat: true }
        };
        saveUsersDB(db);
    }
}

function registerUser(username, password) {
    const db = getUsersDB();
    if (db[username]) return { ok: false, error: 'Этот ник уже занят!' };
    db[username] = {
        password: password,
        balance: 5000, level: 1, xp: 0, xpNext: 100,
        garage: [],
        plate: null,
        activeBuffs: { luckSpins: 0, sellTimer: 0, sellActive: false },
        unlockedTypes: { auto: true, moto: true, spec: false, police: false, diplomat: false }
    };
    saveUsersDB(db);
    return { ok: true };
}

function loginUser(username, password) {
    const db = getUsersDB();
    if (!db[username]) return { ok: false, error: 'Неверный логин или пароль!' };
    if (db[username].password !== password) return { ok: false, error: 'Неверный логин или пароль!' };
    return { ok: true };
}

function loadUserState(username) {
    const db = getUsersDB();
    const data = db[username];
    if (!data) return false;
    balance = data.balance ?? 5000;
    level = data.level ?? 1;
    xp = data.xp ?? 0;
    xpNext = data.xpNext ?? 100;
    garage = data.garage ? JSON.parse(JSON.stringify(data.garage)) : [];

    db[currentUser].garage = JSON.parse(JSON.stringify(garage));

/* ==================== INFINITE SLOT ANIMATION ==================== */
function buildStrip(pool, targetChar, length) {
    // Build 10x multiplied array for infinite feel
    const strip = [];
    for (let i = 0; i < length; i++) {
        strip.push(pool[Math.floor(Math.random() * pool.length)]);
    }
    strip.push(targetChar);
    return strip;
}

function animateSlot(slot, pool, targetChar, baseDuration, index) {
    const reel = slot.querySelector('.reel');
    if (!reel) return 0;
    
    // Use spinCount to make each spin unique and infinite
    spinCount++;
    const stripLength = 60 + (spinCount % 20); // dynamic length
    const stripChars = buildStrip(pool, targetChar, stripLength);
    reel.innerHTML = '';
    stripChars.forEach(ch => {
        const el = document.createElement('div');
        el.className = 'char';
        el.textContent = ch;
        reel.appendChild(el);
    });

    const charHeight = 54;
    const totalChars = stripChars.length;
    const finalOffset = (totalChars - 1) * charHeight;

    // Reset with no transition
    reel.style.transition = 'none';
    reel.style.transform = 'translateY(0)';
    void reel.offsetHeight;
    
    // Animate with unique timing per spin
    const dur = baseDuration + index * 60 + (spinCount % 10) * 15;
    reel.style.transition = 'transform ' + dur + 'ms cubic-bezier(0.15, 0.85, 0.25, 1)';
    reel.style.transform = 'translateY(-' + finalOffset + 'px)';
    
    return dur;
}

function rollAllSlots(targetPlate, callback) {
    if (isRolling) return;
    isRolling = true;
    
    spinDigitsBtn.disabled = true;
    spinLettersBtn.disabled = true;
    toGarageBtn.disabled = true;
    dumpGovBtn.disabled = true;
    
    regionSelect.disabled = true;
    regionLocked = true;

    plateChars.innerHTML = '';
    const slotsData = [
        { char: targetPlate.letter1, pool: GOST_LETTERS },
        { char: targetPlate.digits[0], pool: ALL_DIGITS },
        { char: targetPlate.digits[1], pool: ALL_DIGITS },
        { char: targetPlate.digits[2], pool: ALL_DIGITS },
        { char: targetPlate.letter2, pool: GOST_LETTERS },
        { char: targetPlate.letter3, pool: GOST_LETTERS }
    ];

    let maxDur = 0;
    slotsData.forEach((data, i) => {
        const slot = document.createElement('div');
        slot.className = 'slot';
        const reel = document.createElement('div');
        reel.className = 'reel';
        slot.appendChild(reel);
        plateChars.appendChild(slot);
        const dur = animateSlot(slot, data.pool, data.char, 900, i);
        if (dur > maxDur) maxDur = dur;
    });

    regionNum.textContent = targetPlate.region;

    setTimeout(() => {
        isRolling = false;
        if (callback) callback();
    }, maxDur + 100);
}

/* ==================== PLATE LOGIC ==================== */
function randomGostLetter() { return GOST_LETTERS[Math.floor(Math.random() * GOST_LETTERS.length)]; }
function randomDigit() { return ALL_DIGITS[Math.floor(Math.random() * ALL_DIGITS.length)]; }

function computeRarityAndPrice(p) {
    if (!p) return { rarity: null, price: 0 };
    
    const digits = p.digits;
    const letters = p.letter1 + p.letter2 + p.letter3;
    const region = p.region;
    const type = p.type;

    let rarity = 'Обычный';
    let price = 0;

    if (type === 'moto') price = 70;
    else if (type === 'spec') price = 120;
    else if (type === 'police') price = 150;
    else if (type === 'diplomat') price = 2000;
    else price = 100;

    const isSpecialSeries = (letters === 'АМР' || letters === 'ЕКХ') && (region === '97' || region === '99' || region === '77');
    if (isSpecialSeries) {
        rarity = 'Правительственный';
        price = Math.floor(100000000 + Math.random() * 400000000);
        return { rarity, price };
    }

    if (type === 'diplomat') {
        rarity = 'Правительственный';
        price = Math.floor(5000000 + Math.random() * 10000000);
        return { rarity, price };
    }

    const d1 = digits[0], d2 = digits[1], d3 = digits[2];
    if (d1 === d2 && d2 === d3 && d1 !== '0') {
        rarity = 'Легенда';
        const base = parseInt(d1) === 7 || parseInt(d1) === 1 ? 500000 : 300000;
        price = Math.floor(base + Math.random() * base * 0.5);
        return { rarity, price };
    }

    if (p.letter1 === p.letter2 && p.letter2 === p.letter3) {
        rarity = 'Редкий';
        price = Math.floor(30000 + Math.random() * 50000);
        return { rarity, price };
    }

    if (d1 === d3 && d1 !== '0' && d1 !== d2) {
        rarity = 'Эпический';
        const d = parseInt(d1);
        if (d === 7 || d === 1) {
            price = Math.floor(10000 + Math.random() * 5000);
        } else {
            price = Math.floor(5000 + Math.random() * 5000);
        }
        return { rarity, price };
    }

    if ((d1 === d2 && d1 !== '0') || (d2 === d3 && d2 !== '0')) {
        rarity = 'Редкий';
        price = Math.floor(1000 + Math.random() * 3000);
        return { rarity, price };
    }

    if (type === 'police') {
        rarity = 'Редкий';
        price = Math.floor(500 + Math.random() * 1000);
        return { rarity, price };
    }

    rarity = 'Обычный';
    price = Math.floor(70 + Math.random() * 80);
    return { rarity, price };
}

function updatePlateStats() {
    if (!plate) { renderBlankPlate(); return; }
    const { rarity, price } = computeRarityAndPrice(plate);
    currentRarity = rarity;
    currentPrice = price;

    rarityDisplay.textContent = rarity;
    priceDisplay.textContent = formatMoney(price);

    rarityDisplay.className = 'rarity-text';
    plateWrapper.className = 'plate-wrapper';
    if (rarity === 'Эпический') { rarityDisplay.classList.add('epic'); plateWrapper.classList.add('rarity-epic'); }
    else if (rarity === 'Редкий') { rarityDisplay.classList.add('rare'); plateWrapper.classList.add('rarity-rare'); }
    else if (rarity === 'Легенда') { rarityDisplay.classList.add('legend'); plateWrapper.classList.add('rarity-legend'); }
    else if (rarity === 'Правительственный') { rarityDisplay.classList.add('gov'); plateWrapper.classList.add('rarity-gov'); }
    else { plateWrapper.classList.add('rarity-common'); }

    if (rarity === 'Легенда') {
        spawnConfetti(['#ffd700', '#ffaa00', '#ffcc00', '#ff8800']);
    } else if (rarity === 'Правительственный') {
        spawnConfetti(['#ff0000', '#ff4444', '#aa0000', '#ffcc00']);
    }
}

            type: currentType

            letter2: plate.letter2,
            letter3: plate.letter3,
            region: plate.region,

        };
    }

    rollAllSlots(targetPlate, () => {

        if (activeBuffs.luckSpins > 0) { activeBuffs.luckSpins--; updateBuffsUI(); }

/* ==================== STATE LIQUIDATION ==================== */
function dumpToState() {
    if (!plate) { showToast('Сначала создайте номер!'); return; }
    if (isRolling) return;
    
    let payout = 5;
    if (currentRarity === 'Обычный') payout = 5;
    else if (currentRarity === 'Редкий') payout = 50;
    else if (currentRarity === 'Эпический') payout = 500;
    else if (currentRarity === 'Легенда') payout = 5000;
    else if (currentRarity === 'Правительственный') payout = 500000;

    const digits = plate.digits;
    if (digits[0] === digits[1] && digits[1] === digits[2] && digits[0] !== '0') {
        payout = Math.min(payout, 5000);
    }
    if (digits[0] === digits[2] && digits[0] !== '0') {
        payout = Math.min(payout, 500);
    }
    
    const letters = plate.letter1 + plate.letter2 + plate.letter3;
    if ((letters === 'АМР' || letters === 'ЕКХ') && (plate.region === '97' || plate.region === '99' || plate.region === '77')) {
        payout = 500000;
    }

    balance += payout;
    updateBalanceUI();
    showToast('🏛 Слито в гос: ' + formatMoney(payout));
    addXp(3);
    plate = null;
    renderBlankPlate();
    saveUserState();
}

                    balance += finalPrice;
                    myListings.splice(idx, 1);
                    updateBalanceUI();
                    addXp(30);
                    saveUserState();
                    showChatNotification('💬 Ваш лот успешно выкуплен перекупщиком! +' + formatMoney(finalPrice));
                }
            }, 10000);
        };
    }, 50);
}

/* ==================== MODALS ==================== */
function openModal(title, contentHTML) {
    modalTitle.textContent = title;
    modalList.innerHTML = contentHTML;
    modalOverlay.classList.add('active');
}

function closeModal() { modalOverlay.classList.remove('active'); }

function showGarage() {
    if (garage.length === 0) {
        openModal('🏠 Гараж', '<div style="color:#5a8a9a;text-align:center;padding:20px;">Гараж пуст. Добавьте номера!</div>');
        return;
    }
    let html = '<div class="garage-grid">';
    garage.forEach((item, i) => {
        const plateStr = item.letter1 + ' ' + item.digits + ' ' + item.letter2 + item.letter3;
        const rarityClass = item.rarity === 'Правительственный' ? 'rarity-gov'
            : item.rarity === 'Легенда' ? 'rarity-legend'
            : item.rarity === 'Редкий' ? 'rarity-rare'
            : item.rarity === 'Эпический' ? 'rarity-epic' : '';
        html += '<div class="garage-item ' + rarityClass + '">' +
            '<div class="garage-plate-mini">' + plateStr + ' | ' + item.region + '</div>' +
            '<div class="item-meta">' + item.rarity + ' · ' + item.type + '</div>' +
            '<div class="item-price-small">' + formatMoney(item.price) + '</div>' +
            '<div class="garage-buttons">' +
                '<button class="auction-btn" data-auction="' + i + '">📊 Аукцион</button>' +
                '<button class="market-btn" data-market="' + i + '">📢 На Рынок</button>' +
            '</div>' +
        '</div>';
    });
    html += '</div>';
    openModal('🏠 Гараж', html);

    modalList.querySelectorAll('[data-auction]').forEach(btn => {
        btn.addEventListener('click', () => {
            const idx = parseInt(btn.getAttribute('data-auction'));
            startAuction(idx);
        });
    });
    modalList.querySelectorAll('[data-market]').forEach(btn => {
        btn.addEventListener('click', () => {
            const idx = parseInt(btn.getAttribute('data-market'));
            showListOnMarketPrompt(idx);
        });
    });
}

function startAuction(index) {
    if (index < 0 || index >= garage.length) return;
    const item = garage[index];
    closeModal();
    auctionOverlay.classList.add('active');
    auctionResult.textContent = '';
    let timeLeft = 5;
    auctionTimer.textContent = timeLeft;

    const interval = setInterval(() => {
        timeLeft--;
        auctionTimer.textContent = timeLeft;
        if (timeLeft <= 0) {
            clearInterval(interval);
            const bonusPct = 10 + Math.random() * 40;
            const isBonus = Math.random() > 0.35;
            let finalPrice;
            if (isBonus) {
                finalPrice = Math.floor(item.price * (1 + bonusPct / 100));
                auctionResult.textContent = '+' + Math.floor(bonusPct) + '% → ' + formatMoney(finalPrice);
                auctionResult.style.color = '#aaffaa';
            } else {
                finalPrice = Math.floor(item.price * (1 - bonusPct / 100));
                auctionResult.textContent = '-' + Math.floor(bonusPct) + '% → ' + formatMoney(finalPrice);
                auctionResult.style.color = '#ffaaaa';
            }
            balance += finalPrice;
            updateBalanceUI();
            garage.splice(index, 1);
            addXp(20);
            saveUserState();
            setTimeout(() => {
                auctionOverlay.classList.remove('active');
                showToast('Аукцион: ' + formatMoney(finalPrice));
            }, 1800);
        }
    }, 1000);
}

function showMarket() {
    const luckActive = activeBuffs.luckSpins > 0;
    const sellActive = activeBuffs.sellActive;
    openModal('💰 Черный рынок',
        '<div class="modal-item">' +
            '<div><div class="item-desc">🍀 Удача +30%</div><div style="font-size:10px;color:#5a8a9a;">15 спинов</div></div>' +
            '<button class="buy-btn" id="buyLuckBtn" ' + (luckActive ? 'disabled' : '') + '>' + (luckActive ? '✅ Активно' : '1500 ₽') + '</button>' +
        '</div>' +
        '<div class="modal-item">' +
            '<div><div class="item-desc">💰 x2 Продажа</div><div style="font-size:10px;color:#5a8a9a;">60 секунд</div></div>' +
            '<button class="buy-btn" id="buySellBtn" ' + (sellActive ? 'disabled' : '') + '>' + (sellActive ? '✅ Активно' : '2000 ₽') + '</button>' +
        '</div>' +
        '<div style="color:#5a8a9a;font-size:11px;text-align:center;margin-top:8px;">Баффы сохраняются при перезагрузке</div>'
    );

    setTimeout(() => {
        const buyLuck = $('buyLuckBtn');
        const buySell = $('buySellBtn');
        if (buyLuck && !luckActive) {
            buyLuck.onclick = () => {
                if (balance >= 1500) {
                    balance -= 1500;
                    activeBuffs.luckSpins += 15;
                    updateBalanceUI();
                    updateBuffsUI();
                    saveUserState();
                    showToast('🍀 Удача +30% на 15 спинов!');
                    addXp(20);
                    closeModal();
                } else showToast('Недостаточно средств!');
            };
        }
        if (buySell && !sellActive) {
            buySell.onclick = () => {
                if (balance >= 2000) {
                    balance -= 2000;
                    startSellTimer(60);
                    updateBalanceUI();
                    saveUserState();
                    showToast('💰 x2 Продажа на 60 секунд!');
                    addXp(20);
                    closeModal();
                } else showToast('Недостаточно средств!');
            };
        }
    }, 50);
}

/* ==================== VEHICLE TYPE PURCHASE ==================== */
function trySelectType(type) {
    if (unlockedTypes[type]) {
        currentType = type;
        document.querySelectorAll('.type-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.type === type);
        });
        plateDisplay.className = 'real-plate type-' + type;
        if (plate) {
            plate.type = type;
            updatePlateStats();
        }
        saveUserState();
        return;
    }
    const cost = VEHICLE_UNLOCK_COST[type];
    const typeNames = { spec: 'Спецслужбы', police: 'Полиция', diplomat: 'Дипломаты' };
    openModal('Разблокировать тип?',
        '<div style="text-align:center;padding:10px 0;">' +
            '<div style="font-size:14px;margin-bottom:12px;color:#b0d0e0;">Тип «' + typeNames[type] + '» заблокирован.</div>' +
            '<div style="font-size:20px;font-weight:800;color:#ffd966;margin-bottom:16px;">Цена: ' + formatMoney(cost) + '</div>' +
            '<div style="font-size:12px;color:#5a8a9a;margin-bottom:16px;">Ваш баланс: ' + formatMoney(balance) + '</div>' +
            '<div class="confirm-buttons">' +
                '<button class="confirm-btn yes" id="confirmBuyType">Купить</button>' +
                '<button class="confirm-btn no" id="cancelBuyType">Отмена</button>' +
            '</div>' +
        '</div>'
    );
    setTimeout(() => {
        const yesBtn = $('confirmBuyType');
        const noBtn = $('cancelBuyType');
        if (yesBtn) yesBtn.onclick = () => {
            if (balance >= cost) {
                balance -= cost;
                unlockedTypes[type] = true;
                updateBalanceUI();
                saveUserState();
                const btn = document.querySelector('.type-btn[data-type="' + type + '"]');
                if (btn) {
                    btn.classList.remove('locked');
                    const lockIcon = btn.querySelector('.lock-icon');
                    if (lockIcon) lockIcon.remove();
                }
                showToast('✅ Тип разблокирован!');
                closeModal();
                trySelectType(type);
            } else {
                showToast('Недостаточно средств!');
            }
        };
        if (noBtn) noBtn.onclick = closeModal;
    }, 50);
}

/* ==================== ADMIN ==================== */
function showAdmin() {
    openModal('⚙️ Админ-панель',
        '<div style="margin-bottom:10px;">' +
            '<div class="admin-row">' +
                '<input type="number" class="admin-input" id="adminBalanceInput" placeholder="Сумма">' +
                '<button class="admin-action-btn success" id="adminAddBalanceBtn">+</button>' +
                '<button class="admin-action-btn danger" id="adminSubBalanceBtn">-</button>' +
            '</div>' +
            '<div class="admin-row">' +
                '<input type="number" class="admin-input" id="adminLevelInput" placeholder="Уровень">' +
                '<button class="admin-action-btn" id="adminSetLevelBtn">Установить</button>' +
            '</div>' +
            '<div style="border-top:1px solid #1a3a4a;margin:10px 0;padding-top:10px;">' +
                '<div style="color:#5a8a9a;font-size:11px;margin-bottom:6px;">Принудительный спавн номера:</div>' +
                '<div class="admin-row">' +
                    '<input type="text" class="admin-input" id="adminPlateLetters" placeholder="Буквы" maxlength="3" value="АМР">' +
                    '<input type="text" class="admin-input" id="adminPlateDigits" placeholder="Цифры" maxlength="3" value="777">' +
                '</div>' +
                '<div class="admin-row">' +
                    '<input type="text" class="admin-input" id="adminPlateRegion" placeholder="Регион" maxlength="3" value="97">' +
                    '<button class="admin-action-btn" id="adminSpawnPlateBtn">Спавн</button>' +
                '</div>' +
                '<div class="admin-row">' +
                    '<button class="admin-action-btn" id="adminUnlockAllBtn">Разблокировать всё</button>' +
                '</div>' +
            '</div>' +
        '</div>'
    );

    setTimeout(() => {
        const addBtn = $('adminAddBalanceBtn');
        const subBtn = $('adminSubBalanceBtn');
        const setLvlBtn = $('adminSetLevelBtn');
        const spawnBtn = $('adminSpawnPlateBtn');
        const unlockBtn = $('adminUnlockAllBtn');

        if (addBtn) addBtn.onclick = () => {
            const v = parseFloat($('adminBalanceInput').value);
            if (!isNaN(v) && v > 0) { balance += v; updateBalanceUI(); saveUserState(); showToast('+' + formatMoney(v)); }
        };
        if (subBtn) subBtn.onclick = () => {
            const v = parseFloat($('adminBalanceInput').value);
            if (!isNaN(v) && v > 0) { balance = Math.max(0, balance - v); updateBalanceUI(); saveUserState(); showToast('-' + formatMoney(v)); }
        };
        if (setLvlBtn) setLvlBtn.onclick = () => {
            const v = parseInt($('adminLevelInput').value);
            if (!isNaN(v) && v >= 1 && v <= 100) { level = v; xp = 0; xpNext = 100 * v; updateLevelUI(); saveUserState(); showToast('Уровень ' + v); }
        };
        if (spawnBtn) spawnBtn.onclick = () => {
            const lettersStr = ($('adminPlateLetters').value || 'АМР').toUpperCase().slice(0, 3);
            const letters = lettersStr.padEnd(3, 'А').split('');
            const digitsStr = ($('adminPlateDigits').value || '777').slice(0, 3).replace(/[^0-9]/g, '0');
            const region = ($('adminPlateRegion').value || '97').slice(0, 3).replace(/[^0-9]/g, '9') || '97';
            
            const l1 = GOST_LETTERS.includes(letters[0]) ? letters[0] : 'А';
            const l2 = GOST_LETTERS.includes(letters[1]) ? letters[1] : 'В';
            const l3 = GOST_LETTERS.includes(letters[2]) ? letters[2] : 'Е';
            
            plate = {
                letter1: l1,
                digits: digitsStr.padStart(3, '0').slice(0, 3),
                letter2: l2,
                letter3: l3,
                region: region,
                type: currentType
            };
            renderFilledPlate();
            updatePlateStats();
            saveUserState();
            showToast('Номер создан!');
            closeModal();
        };
        if (unlockBtn) unlockBtn.onclick = () => {
            unlockedTypes = { auto: true, moto: true, spec: true, police: true, diplomat: true };
            document.querySelectorAll('.type-btn').forEach(b => {
                b.classList.remove('locked');
                const lockIcon = b.querySelector('.lock-icon');
                if (lockIcon) lockIcon.remove();
            });
            saveUserState();
            showToast('🔓 Все типы разблокированы!');
            closeModal();
        };
    }, 50);
}

/* ==================== TABS ==================== */
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        if (tab === 'admin') { showAdmin(); return; }
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        closeModal();
        if (tab === 'garage') showGarage();
        else if (tab === 'market') showMarket();
        else if (tab === 'online') showOnlineMarket();
    });
});

/* ==================== TYPE SWITCHER ==================== */
document.querySelectorAll('.type-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        trySelectType(btn.dataset.type);
    });
});

/* ==================== REGION SELECT ==================== */
regionSelect.addEventListener('change', () => {
    if (regionLocked) {
        showToast('Регион заблокирован во время спина!');
        regionSelect.value = plate ? plate.region : regionSelect.value;
        return;
    }
    if (plate) {
        plate.region = regionSelect.value;
        regionNum.textContent = plate.region;
        updatePlateStats();
        saveUserState();
    } else {
        regionNum.textContent = regionSelect.value;
    }
});

/* ==================== AUTH ==================== */
const toggleLoginBtn = $('toggleLoginBtn');
const toggleRegisterBtn = $('toggleRegisterBtn');
const loginForm = $('loginForm');
const registerForm = $('registerForm');
const loginError = $('loginError');
const registerError = $('registerError');

toggleLoginBtn.addEventListener('click', () => {
    toggleLoginBtn.classList.add('active');
    toggleRegisterBtn.classList.remove('active');
    loginForm.style.display = 'flex';
    registerForm.style.display = 'none';
    loginError.textContent = '';
    registerError.textContent = '';
});

toggleRegisterBtn.addEventListener('click', () => {
    toggleRegisterBtn.classList.add('active');
    toggleLoginBtn.classList.remove('active');
    registerForm.style.display = 'flex';
    loginForm.style.display = 'none';
    loginError.textContent = '';
    registerError.textContent = '';
});

$('loginSubmitBtn').addEventListener('click', () => {
    const username = $('loginUsername').value.trim();
    const password = $('loginPassword').value;
    loginError.textContent = '';
    if (!username || !password) { loginError.textContent = 'Заполните все поля!'; return; }
    const result = loginUser(username, password);
    if (!result.ok) { loginError.textContent = result.error; return; }
    loginSuccess(username);
});

$('registerSubmitBtn').addEventListener('click', () => {
    const username = $('registerUsername').value.trim();
    const password = $('registerPassword').value;
    const passwordConfirm = $('registerPasswordConfirm').value;
    registerError.textContent = '';
    if (!username || !password) { registerError.textContent = 'Заполните все поля!'; return; }
    if (username.length < 3) { registerError.textContent = 'Логин минимум 3 символа!'; return; }
    if (password.length < 3) { registerError.textContent = 'Пароль минимум 3 символа!'; return; }
    if (password !== passwordConfirm) { registerError.textContent = 'Пароли не совпадают!'; return; }
    const result = registerUser(username, password);
    if (!result.ok) { registerError.textContent = result.error; return; }
    showToast('✅ Аккаунт создан!');
    loginSuccess(username);
});

$('clearStorageBtn').addEventListener('click', () => {
    if (confirm('Сбросить все данные игры? Это удалит все аккаунты и прогресс.')) {
        localStorage.removeItem('blat_users');
        ensureDefaultAdmin();
        location.reload();
    }
});

function loginSuccess(username) {
    currentUser = username;
    loadUserState(username);
    usernameDisplay.textContent = username;
    authScreen.classList.add('hidden');
    updateBalanceUI();
    updateLevelUI();
    
    document.querySelectorAll('.type-btn').forEach(b => {
        const t = b.dataset.type;
        b.classList.toggle('active', t === currentType);
        if (unlockedTypes[t]) {
            b.classList.remove('locked');
            const lockIcon = b.querySelector('.lock-icon');
            if (lockIcon) lockIcon.remove();
        } else {
            b.classList.add('locked');
            if (!b.querySelector('.lock-icon')) {
                const lock = document.createElement('span');
                lock.className = 'lock-icon';
                lock.textContent = '🔒' + (VEHICLE_UNLOCK_COST[t] / 1000000) + 'M';
                b.appendChild(lock);
            }
        }
    });
    
    renderBlankPlate();
    if (plate) {
        renderFilledPlate();
        updatePlateStats();
    }
    updateBuffsUI();
    
    if (username === ADMIN_USERNAME) {
        adminTabBtn.style.display = 'flex';
    } else {
        adminTabBtn.style.display = 'none';
    }
    
    if (activeBuffs.sellActive && activeBuffs.sellTimer > 0) {
        startSellTimer(activeBuffs.sellTimer);
    }
    saveUserState();
    showToast('Добро пожаловать, ' + username + '!');
}

/* ==================== EVENT BINDINGS ==================== */
spinDigitsBtn.onclick = spinDigits;
spinLettersBtn.onclick = spinLetters;
toGarageBtn.onclick = addToGarage;
dumpGovBtn.onclick = dumpToState;

closeModalBtn.onclick = closeModal;
modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeModal();
});

// Double-tap balance for admin
let balanceTapCount = 0;
let balanceTapTimer = null;
balanceDisplay.addEventListener('click', () => {
    balanceTapCount++;
    if (balanceTapTimer) clearTimeout(balanceTapTimer);
    balanceTapTimer = setTimeout(() => { balanceTapCount = 0; }, 400);
    if (balanceTapCount >= 2) {
        balanceTapCount = 0;
        if (!currentUser) { showToast('Сначала войдите!'); return; }
        currentUser = ADMIN_USERNAME;
        usernameDisplay.textContent = ADMIN_USERNAME;
        adminTabBtn.style.display = 'flex';
        showToast('🔓 Админ-режим активирован!');
        const db = getUsersDB();
        if (!db[ADMIN_USERNAME]) ensureDefaultAdmin();
        loadUserState(ADMIN_USERNAME);
        updateBalanceUI();
        updateLevelUI();
        renderBlankPlate();
        if (plate) { renderFilledPlate(); updatePlateStats(); }
        updateBuffsUI();
    }
});

/* ==================== INIT ==================== */
ensureDefaultAdmin();
initNpcListings();
renderBlankPlate();
regionNum.textContent = regionSelect.value;
toGarageBtn.disabled = true;
dumpGovBtn.disabled = true;

setInterval(saveUserState, 5000);
window.addEventListener('beforeunload', saveUserState);

})();
</script>
